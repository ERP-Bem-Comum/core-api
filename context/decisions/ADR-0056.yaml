  issues: []
  note: |
    Importado pelo commit `0b88bade` (2026-06-08) como baseline de FIN-DOCUMENTO-INGESTAO, cujos
    REPORTs em `.claude/.pipeline/FIN-DOCUMENTO-INGESTAO/` referenciam o caminho antigo do arquivo e
    foram preservados como registro histórico. Issue #62 (ingestão OCR) segue aberta e adiada.
