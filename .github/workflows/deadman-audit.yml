name: deadman-audit

# Auditor (ADR-0042): cruza o S3 (status/) com history.jsonl, decide inatividade pelo
# registro mais recente das DUAS fontes, faz self-heal, e o commit é keep-alive (evita a
# suspensão de 60 dias do GitHub p/ workflows agendados). Dispara o payload se morto.
#
# NB: o cron do GitHub é UTC. 03:05 UTC = 00:05 America/Sao_Paulo (UTC-3). A decisão é
# por ESTADO (não por horário), então jitter do agendador não afeta a corretude.
on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write # payload mínimo = abrir issue de alerta (payload completo: #72)

concurrency:
  group: deadman-history
  cancel-in-progress: false

env:
  THRESHOLD_DAYS: '3' # SLO provisório — D3/#72 fixa o valor por emitter
  AWS_ACCESS_KEY_ID: ${{ secrets.DEADMAN_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.DEADMAN_S3_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.DEADMAN_S3_REGION }}
  S3_ENDPOINT: ${{ secrets.DEADMAN_S3_ENDPOINT }}
  S3_BUCKET: ${{ secrets.DEADMAN_S3_BUCKET }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # A decisão roda em Node (scripts/ci/deadman-audit.ts) — sem pinar a versão, o
      # `--experimental-strip-types` fica à mercê do runtime da imagem `ubuntu-latest`, e uma quebra
      # aqui mata o step ANTES do commit de keep-alive.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Baixar pings do S3 (status/)
        run: |
          set -euo pipefail
          mkdir -p deadman && touch deadman/history.jsonl
          : > /tmp/remote.jsonl
          keys=$(aws s3api list-objects-v2 --endpoint-url "$S3_ENDPOINT" --bucket "$S3_BUCKET" \
                   --prefix "status/" --query 'Contents[].Key' --output text 2>/dev/null || true)
          for k in $keys; do
            [ -n "$k" ] && [ "$k" != "None" ] || continue
            aws s3 cp "s3://$S3_BUCKET/$k" - --endpoint-url "$S3_ENDPOINT" >> /tmp/remote.jsonl 2>/dev/null || true
            printf '\n' >> /tmp/remote.jsonl
          done
          # remove linhas vazias
          sed -i '/^[[:space:]]*$/d' /tmp/remote.jsonl || true
          echo "pings remotos: $(wc -l < /tmp/remote.jsonl)"

      - name: Self-heal (S3 → history.jsonl)
        run: |
          set -euo pipefail
          # self-heal: pings remotos ausentes em history (por emitter+seq) → audit-merge.
          merged=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            e=$(jq -r '.emitter' <<<"$line"); s=$(jq -r '.seq' <<<"$line")
            dup=$(jq -s --arg e "$e" --argjson s "$s" 'map(select(.emitter==$e and .seq==$s))|length' deadman/history.jsonl)
            if [ "$dup" -eq 0 ]; then
              now=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
              jq -c --arg src audit-merge --arg now "$now" '. + {source:$src, ingested_at:$now}' <<<"$line" >> deadman/history.jsonl
              merged=$((merged+1))
            fi
          done < /tmp/remote.jsonl
          echo "merged=$merged" >> "$GITHUB_ENV"

      # A DECISÃO vive em scripts/ci/deadman-audit.ts, não aqui (#368). Bootstrap (nenhum ping
      # jamais visto) NÃO é morte: sem `last_seen`, a condição do ADR-0042 (`now − last_seen >
      # limite`) é indefinida. O bash inline que decidia isso gerou 14 issues `sem sinal há 0h`.
      - name: Decidir (script testado) + payload + keep-alive
        run: |
          set -euo pipefail
          run_at=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)

          # Um JSON com o veredito de CADA emissor. O script não tem efeito colateral — quem age é
          # este step. `alreadyAlerted` é derivado do próprio audit.jsonl (dedup por transição).
          node --experimental-strip-types --no-warnings scripts/ci/deadman-audit.ts \
            deadman/emitters.json deadman/history.jsonl deadman/audit.jsonl "$run_at" > /tmp/verdicts.json

          # O loop NÃO pode abortar o step: o commit lá embaixo é o keep-alive contra a suspensão
          # de 60 dias, e perdê-lo por uma falha de alerta enfraquece o próprio dead-man. Falha de
          # payload é registrada e re-erguida no FIM (sem `|| true`, que engoliria — ADR-0011).
          : > /tmp/payload-failures
          while IFS= read -r v; do
            emitter=$(jq -r '.emitter'       <<<"$v")
            st=$(jq      -r '.status'        <<<"$v")   # `status` é read-only em alguns shells
            age=$(jq     -r '.ageHours'      <<<"$v")   # "null" quando nunca pingou
            seen=$(jq    -r '.lastSeen'      <<<"$v")   # idem
            th=$(jq      -r '.thresholdDays' <<<"$v")
            fires=$(jq   -r '.firesPayload'  <<<"$v")

            # `delivered` = o CANAL MÍNIMO (a issue do GitHub — `permissions:` acima já o chama de
            # "payload mínimo") foi entregue. É esse valor, não a decisão `fires`, que vira
            # `payload_fired` no `audit.jsonl` — e é dele que a PRÓXIMA execução deriva o dedup
            # (`deriveAlreadyAlerted`): sem isso, uma falha transitória do `gh` suprimiria a
            # retentativa e a morte se perderia em silêncio (F4, round 3).
            #
            # DECISÃO DELIBERADA (F4, round 4 — escalada e aprovada pelo dono do repo, "Opção A"):
            # só a falha do `gh issue create` zera `delivered` (o `delivered=false` logo abaixo do
            # `then`, mais adiante). A falha do Discord (bloco `curl` a seguir) NÃO zera `delivered`
            # — é PROPOSITAL, não esquecimento. Motivo: `gh issue create` não é idempotente, cada
            # chamada cria uma issue NOVA. Se a falha do Discord também zerasse `delivered`, a
            # PRÓXIMA execução veria `payload_fired` ausente e retentaria os DOIS canais, recriando
            # uma issue DUPLICADA para a MESMA morte — a classe exata do bug original deste ticket
            # (#368: 14 issues idênticas). O Discord é BEST-EFFORT: uma falha dele já falha o step
            # (`exit 1` no fim, via /tmp/payload-failures) e fica visível no run do Actions, mas não
            # é retentada automaticamente. Semântica documentada em
            # `handbook/infrastructure/07-deadman-switch-data-contracts.md` §3.2.
            #
            # NÃO "conserte" isto espelhando `delivered=false` para dentro do bloco do `curl` abaixo
            # — essa opção foi considerada e rejeitada pelo motivo acima.
            delivered=false
            if [ "$fires" = "true" ]; then
              delivered=true
              if ! gh issue create \
                --title "🔴 DEAD-MAN FIRED — ${emitter} sem sinal há ${age}h (limite ${th}d)" \
                --body "Auditor: o emissor \`${emitter}\` ultrapassou a janela de ${th} dia(s) — último sinal em \`${seen}\` (há ${age}h). Ver \`deadman/audit.jsonl\`." \
                --label "agent-found,priority:p1"
              then
                echo "issue:${emitter}" >> /tmp/payload-failures
                delivered=false
              fi
              if [ -n "${DEADMAN_DISCORD_WEBHOOK:-}" ]; then
                if ! curl -fsS -X POST "$DEADMAN_DISCORD_WEBHOOK" -H 'Content-Type: application/json' \
                  -d "$(jq -nc --arg c "🔴 DEAD-MAN FIRED — ${emitter} sem sinal há ${age}h (limite ${th}d)" '{content:$c}')" \
                  2>/tmp/curl-err
                then
                  # a mensagem nativa do curl pode conter o host do webhook — não ecoar.
                  # Best-effort: falha aqui NÃO zera `delivered` (ver comentário acima do bloco,
                  # decisão deliberada F4/round 4) — só registra em /tmp/payload-failures, que já
                  # faz o step falhar no fim. Não é retentada na próxima execução.
                  echo "discord:${emitter}" >> /tmp/payload-failures
                fi
              fi
            fi

            # Uma linha POR EMISSOR (o `emitter:"*"` antigo não dizia QUAL emissor morreu), e é
            # daqui que a próxima execução deriva o dedup. Shape = §3 do contrato de dados (v:2).
            jq -nc --arg run "$run_at" --arg em "$emitter" --arg st "$st" \
                   --argjson seen "$(jq -c '.lastSeen' <<<"$v")" \
                   --argjson age "$age" --argjson th "$th" --argjson m "${merged:-0}" \
                   --argjson f "$delivered" \
              '{v:2, run_at:$run, emitter:$em, last_seen:$seen, age_h:$age, status:$st,
                merged:$m, threshold_days:$th}
               + (if $f then {payload_fired:true} else {} end)' >> deadman/audit.jsonl
          done < <(jq -c '.verdicts[]' /tmp/verdicts.json)

          # commit de auditoria = keep-alive contra a suspensão de 60 dias de workflows agendados.
          # `--allow-empty` garante o keep-alive mesmo num run sem emissor configurado.
          git config user.name "deadman-bot"
          git config user.email "deadman-bot@users.noreply.github.com"
          git add deadman/
          git commit --allow-empty -m "chore(deadman): audit run ${run_at} (merged=${merged:-0})"
          git push

          # Só agora o step falha, com o keep-alive já garantido.
          if [ -s /tmp/payload-failures ]; then
            echo "::error::payload de contingência falhou: $(tr '\n' ' ' < /tmp/payload-failures)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEADMAN_DISCORD_WEBHOOK: ${{ secrets.DEADMAN_DISCORD_WEBHOOK }}
