name: fecha-issue-na-dev

# "Issue fecha entrando na `dev`; a release é o ajuntamento que fecha na `main`."
#
# Por que este workflow existe, e não a troca da branch default:
#   o GitHub fecha issue automaticamente só quando o PR entra na branch DEFAULT, e a default deste
#   repositório é a `main` — de propósito, porque é ela que o Dependabot e o code scanning medem.
#   Trocar a default para `dev` daria o fechamento de graça e tiraria PRODUÇÃO de vigilância.
#
# ⚠️ `pull_request_target`, e não `pull_request`: o repositório é PÚBLICO e pode receber PR de fork,
# cujo `GITHUB_TOKEN` é read-only — `gh issue close` falharia em silêncio justamente no caso que mais
# precisa de rastro. O `_target` roda com o token do repositório base.
#
# O que torna `pull_request_target` perigoso é executar CÓDIGO do PR com esse token. Aqui o checkout
# é FIXADO em `base.sha` e nenhum passo instala dependência nem roda build: o único código executado
# é o script já versionado na base. Um PR que altere o script não altera o que este workflow roda.

on:
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions:
  contents: read
  issues: write

concurrency:
  # Sem cancel-in-progress: cancelar no meio deixaria parte das issues fechadas e parte não.
  group: fecha-issue-na-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fechar:
    name: fecha-issue-na-dev
    # Fechado sem merge (PR abandonado) não entrega nada — e não fecha issue nenhuma.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da BASE (nunca do código do PR)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Versão vem do .nvmrc, nunca de literal — ver
          # tests/cleanup/node-version-single-source.test.ts.
          node-version-file: .nvmrc

      - name: Fecha as issues que o PR declara fechar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Título e corpo vão por env, nunca interpolados no `run` — interpolação de texto de PR
          # dentro de shell é injeção de comando, e o corpo aqui é escrito por quem abre o PR.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # ⚠️ `base.sha` é o tip da `dev` ANTES do merge. Um PR mergeado enquanto estava BEHIND
        # carrega um base.sha anterior a este commit, onde o script ainda não existe — e `node`
        # morreria com ERR_MODULE_NOT_FOUND, pintando de vermelho um job sem defeito algum. Degrada
        # sozinho depois do primeiro ciclo, mas um vermelho que não descreve defeito gasta a
        # credibilidade de todos os outros.
        run: |
          if [ ! -f scripts/ci/close-issues-on-dev-merge.ts ]; then
            echo "::notice::o script nao existe na base deste PR (base.sha anterior a ele) — nada a fazer"
            exit 0
          fi
          node scripts/ci/close-issues-on-dev-merge.ts
