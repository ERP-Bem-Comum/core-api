name: ci

# Gate de qualidade automatizado em PR — espelha o gate local (CLAUDE.md §"Política de regressão zero
# fail-first"): typecheck + format:check + lint + test (unit). Hoje o W3 só roda na
# máquina do dev; este workflow torna o gate obrigatório e auditável em todo PR.
#
# Roda OFFLINE: os testes de integração (MySQL/MinIO) ficam atrás de opt-in
# (*_INTEGRATION=1) e NÃO disparam aqui — `pnpm test` puro executa apenas a camada
# unit. Integração continua via `pnpm run test:integration:*` (precisa de Docker).

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: typecheck + format + lint + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # ADR-0011 §"Pin de versões" — pin por SHA.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Node 24 (runtime do --experimental-strip-types)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Habilita pnpm (corepack lê a versão do packageManager)
        run: corepack enable
      - name: Install (frozen-lockfile)
        run: pnpm install --frozen-lockfile
      # Sem esta restauração o `--cache` do lint não vale NADA aqui: o runner nasce limpo,
      # o cache é sempre frio, e o gate paga os ~44s cheios (Inquiry-0029, §4).
      # A chave inclui o lockfile e a config porque ambos invalidam o cache do ESLint;
      # `restore-keys` aceita cache de outro commit — o ESLint revalida por arquivo.
      - name: Restaura cache do ESLint
        # ADR-0011 §"Pin de versões" — pin por SHA.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'tsconfig.json') }}-
            eslint-${{ runner.os }}-
      - name: Typecheck
        run: pnpm run typecheck
      - name: Format check
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Test (unit)
        run: pnpm test
