name: audit

# Auditoria de vulnerabilidades conhecidas das dependências (supply-chain — ADR-0011; política espelhada
# do ADR-0023 do web-app depois do incidente de 28/10/2026, em que o `zod` high ficou em produção).
# `pnpm audit` consulta o registry de advisories pela rede; por isso vive AQUI (CI),
# fora do gate W3 local (`pnpm test`/typecheck/lint), que é offline e determinístico.
#
#   prod  (BLOCKING, check OBRIGATÓRIO na proteção de dev e main) — dependencies de runtime, falha em
#          high/critical. Roda em TODO PR e push: antes rodava só quando o PR mexia em dependência, e
#          advisory novo em dependência JÁ instalada nunca aparecia — além de não poder ser obrigatório
#          (check que não roda deixa o PR pendurado).
#   full  (REPORT-ONLY) — todas as deps; visibilidade, não bloqueia.
#   scheduled (ALERTA) — todo dia audita main E dev; vermelho abre/atualiza issue ATRIBUÍDA.
#
# FALHA FECHADA: registry de advisories fora do ar reprova após 3 tentativas, com a causa escrita. O
# `--ignore-registry-errors` foi retirado: ele saía 0 sem ter auditado nada. A lógica está em
# `.github/scripts/audit-gate.sh` (distingue achado de erro de rede pelo próprio relatório do pnpm).

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    # Diário 06:30 UTC (03:30 BRT) — pega advisories novos sem precisar de PR.
    - cron: '30 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prod:
    name: audit (produção — blocking)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # ADR-0011 §"Pin de versões" — pin por SHA.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Node (executa .ts direto, sem flag) — versão lida do .nvmrc
        # Sem este passo o job rodava no Node pré-instalado da imagem do runner, que muda sem
        # aviso — exatamente o "o CI escolhe sozinho" que o ADR-0073 §2 encerra.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Habilita pnpm (corepack — packageManager pinado em package.json)
        run: corepack enable
      - name: Audit (dependencies de runtime ≥ high) — falha fechada
        run: bash .github/scripts/audit-gate.sh --prod

  full:
    name: audit (todas as deps — report-only)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Node — versão lida do .nvmrc
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Habilita pnpm (corepack — packageManager pinado em package.json)
        run: corepack enable
      - name: Audit completo (visibilidade de devDependencies — não bloqueia)
        run: bash .github/scripts/audit-gate.sh --all

  scheduled:
    name: audit agendado (${{ matrix.ref }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # abrir/comentar/fechar a issue de alerta
    strategy:
      fail-fast: false
      matrix:
        ref: [main, dev]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Node — versão lida do .nvmrc
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Habilita pnpm (corepack — packageManager pinado em package.json)
        run: corepack enable
      - name: Audit (dependencies de runtime ≥ high)
        env:
          AUDIT_OUT: ${{ runner.temp }}/audit.txt
        run: bash .github/scripts/audit-gate.sh --prod

      - name: Alerta — abre ou atualiza a issue (atribuída)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ matrix.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEES: GabrielAderaldo,lekadecastro
          AUDIT_OUT: ${{ runner.temp }}/audit.txt
          DEADMAN_DISCORD_WEBHOOK: ${{ secrets.DEADMAN_DISCORD_WEBHOOK }}
        run: bash .github/scripts/audit-alert.sh open

      - name: Resolve — fecha a issue quando voltar a verde
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ matrix.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/audit-alert.sh close
